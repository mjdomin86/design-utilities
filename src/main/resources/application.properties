spring.application.name=design-backup-service
server.port=8086

# --- Flowable Design connection ---
flowable.design.base-url=http://localhost:8081
flowable.design.api-prefix=/design-api

# Auth mode: basic | oauth2 | custom-header
# Override credentials via environment variables in any non-local environment.
flowable.design.auth.mode=basic
flowable.design.auth.basic.username=${FLOWABLE_DESIGN_USERNAME:admin}
flowable.design.auth.basic.password=${FLOWABLE_DESIGN_PASSWORD:test}
# No token here: set it from the UI's Settings tab (PUT /api/config/oauth2-token)
# after startup. These tokens are typically short-lived, so baking one into
# config isn't practical; it lives in memory only and is empty after a restart.
# flowable.design.auth.oauth2.token=<not used; configure via the UI>
# flowable.design.auth.custom-header.name=X-Api-Key
# flowable.design.auth.custom-header.value=<value>

# --- Backups ---
# When set, manual and scheduled backups may only write below this directory.
flowable.design.backup.allowed-base-dir=${user.home}
flowable.design.backup.scheduled.enabled=false
flowable.design.backup.scheduled.cron=0 0 2 * * *
# flowable.design.backup.scheduled.workspace-key=default
# flowable.design.backup.scheduled.target-directory=${user.home}/flowable-design-backups
